<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bailin · 桌宠</title>
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <script src="./shared/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/design-system.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
        width: 100%;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      /*
       * 快捷菜单已迁到独立 BrowserWindow，桌宠窗只渲染精灵。
       * 不再为菜单扩宽 / flex 换向，从根上避免右键时左右抽动。
       */
      .pet-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      .pet-slot {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none;
      }
      .pet-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        justify-content: flex-end;
      }
      .pet-wrap-zone {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 100%;
        flex-shrink: 0;
        height: 100%;
      }
      .pet-wrap {
        position: relative;
      }
      .pet-wrap:focus {
        outline: none;
      }
      .pet-wrap:focus-visible {
        outline: 2px solid var(--magenta-soft);
        outline-offset: 4px;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./pet/main.tsx"></script>
  </body>
</html>
